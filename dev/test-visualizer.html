<!doctype html>
<meta charset="utf-8">
<title>visualizer self-check</title>
<svg id="s" viewBox="0 0 800 220"></svg>
<pre id="out"></pre>
<script type="module">
import { render } from "../visualizer.js";
import { pythonToHtml } from "../highlight.js";

const svg = document.getElementById("s");
const results = [];
const check = (name, fn) => {
  try { fn(); results.push("PASS " + name); }
  catch (e) { results.push("FAIL " + name + " — " + e.message); }
};
const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

const step = {
  array: [2, 7, 11, 15],
  pointers: { l: 0, r: 3 },
  vars: { sum: 17, target: 9 },
  highlight: [0, 3],
  caption: "sum is 17",
};

check("draws one box per element", () => {
  render(svg, step);
  assert(svg.querySelectorAll(".cell").length === 4, "expected 4 cells");
});

check("highlights only the highlighted indices", () => {
  render(svg, step);
  const hl = [...svg.querySelectorAll(".cell.hl")].map(e => Number(e.dataset.index));
  assert(JSON.stringify(hl) === "[0,3]", "got " + JSON.stringify(hl));
});

check("draws a pointer for each entry in pointers", () => {
  render(svg, step);
  const names = [...svg.querySelectorAll(".pointer")].map(e => e.dataset.name).sort();
  assert(JSON.stringify(names) === '["l","r"]', "got " + JSON.stringify(names));
});

check("vars go to the readout, not the pointers", () => {
  render(svg, step);
  const readout = svg.querySelector(".readout").textContent;
  assert(readout.includes("sum = 17"), "readout missing sum: " + readout);
  assert(readout.includes("target = 9"), "readout missing target: " + readout);
});

check("an index-valued var stays in the readout and draws no arrow", () => {
  render(svg, { array: [5, 6, 7], pointers: { i: 2 }, vars: { found: 1, total: 0 },
                highlight: [2], caption: "no guessing" });
  const readout = svg.querySelector(".readout").textContent;
  assert(readout.includes("found = 1"), "readout missing found: " + readout);
  assert(readout.includes("total = 0"), "readout missing total: " + readout);
  const names = [...svg.querySelectorAll(".pointer")].map(e => e.dataset.name);
  assert(JSON.stringify(names) === '["i"]', "only pointers become arrows, got " + JSON.stringify(names));
});

check("the caption is not drawn inside the svg", () => {
  render(svg, step);
  assert(svg.textContent.indexOf("sum is 17") === -1, "caption leaked into the svg");
});

check("re-render clears the previous frame", () => {
  render(svg, step);
  render(svg, { array: [1, 2], pointers: { l: 0 }, vars: {}, highlight: [], caption: "x" });
  assert(svg.querySelectorAll(".cell").length === 2, "stale cells left behind");
  assert(svg.querySelectorAll(".pointer").length === 1, "stale pointers left behind");
});

check("two pointers on the same index both render", () => {
  render(svg, { array: [1, 2, 3], pointers: { l: 1, r: 1 }, vars: {}, highlight: [1], caption: "meet" });
  assert(svg.querySelectorAll(".pointer").length === 2, "expected 2 pointers");
});

import { nextBlockingCheckpoint } from "../app.js";

check("no checkpoint means no block", () => {
  assert(nextBlockingCheckpoint([], new Set(), 0) === null, "should not block");
});

check("checkpoint at current step blocks when unanswered", () => {
  const cps = [{ afterStep: 1 }, { afterStep: 3 }];
  assert(nextBlockingCheckpoint(cps, new Set(), 1) === 0, "should block on cp 0");
});

check("answered checkpoint does not block", () => {
  const cps = [{ afterStep: 1 }];
  assert(nextBlockingCheckpoint(cps, new Set([0]), 1) === null, "answered should pass");
});

check("checkpoint for a later step does not block yet", () => {
  const cps = [{ afterStep: 3 }];
  assert(nextBlockingCheckpoint(cps, new Set(), 1) === null, "too early to block");
});


// --- bars view ---------------------------------------------------------
const barStep = {
  array: [0, 1, 0, 2],
  pointers: { l: 0, r: 3 },
  vars: { water: 1 },
  highlight: [3],
  caption: "x",
  water: [0, 0, 1, 0],
};

check("bars view draws one column per element", () => {
  render(svg, barStep, "bars");
  assert(svg.querySelectorAll(".column").length === 4, "expected 4 columns");
});

check("bars view draws water only where depth is non-zero", () => {
  render(svg, barStep, "bars");
  assert(svg.querySelectorAll(".water").length === 1, "expected exactly 1 water rect");
});

check("bars view draws a region slab when given one", () => {
  render(svg, { ...barStep, water: undefined, region: { from: 0, to: 3, level: 2 } }, "bars");
  assert(svg.querySelectorAll(".region").length === 1, "expected 1 region slab");
});

check("switching view clears the previous view's marks", () => {
  render(svg, barStep, "bars");
  render(svg, { array: [1, 2], pointers: { l: 0 }, vars: {}, highlight: [], caption: "x" }, "cells");
  assert(svg.querySelectorAll(".column").length === 0, "stale bars left behind");
  assert(svg.querySelectorAll(".cell").length === 2, "cells did not render");
});

check("an unknown view reports itself instead of drawing nothing", () => {
  render(svg, barStep, "hologram");
  assert(svg.textContent.includes("hologram"), "no message for unknown view");
});


// --- python highlighter -------------------------------------------------

check("escapes markup so learner code cannot inject html", () => {
  const html = pythonToHtml('x = "<img src=x onerror=alert(1)>"');
  assert(!html.includes("<img"), "raw tag survived: " + html);
  assert(html.includes("&lt;img"), "tag was not escaped: " + html);
});

check("escapes ampersands and comparison operators", () => {
  const html = pythonToHtml("if a < b and c > d & e:");
  assert(!/[^;]&[^a]/.test(html.replace(/&amp;|&lt;|&gt;/g, "")), "unescaped & left: " + html);
  assert(html.includes("&lt;") && html.includes("&gt;"), "operators not escaped: " + html);
});

check("colours keywords, strings, numbers and comments", () => {
  const html = pythonToHtml('def f():\n    # note\n    return "s" + 42');
  assert(html.includes('tok-keyword">def'), "def not a keyword: " + html);
  assert(html.includes('tok-comment">#'), "comment missed: " + html);
  assert(html.includes('tok-string">&quot;s&quot;') || html.includes('tok-string">"s"'), "string missed: " + html);
  assert(html.includes('tok-number">42'), "number missed: " + html);
});

check("does not colour keywords inside strings or comments", () => {
  const html = pythonToHtml('x = "return None"  # def foo');
  assert(!html.includes('tok-keyword">return'), "keyword inside string coloured: " + html);
  assert(!html.includes('tok-keyword">def'), "keyword inside comment coloured: " + html);
});

check("names the function after def", () => {
  const html = pythonToHtml("def two_sum(a):");
  assert(html.includes('tok-name">two_sum'), "def name missed: " + html);
});

check("preserves the source text exactly once markup is stripped", () => {
  const src = 'def f(x):\n    return x  # done\n';
  const el = document.createElement("div");
  el.innerHTML = pythonToHtml(src);
  assert(el.textContent === src + "\n", JSON.stringify(el.textContent));
});

document.getElementById("out").textContent = results.join("\n");
</script>
