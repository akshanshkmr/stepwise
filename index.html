<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepwise</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3b82f6">
<meta name="description" content="Learn algorithms by predicting them. Stepwise animates an algorithm, stops where the obvious guess is wrong, and makes you commit before it goes on.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <nav class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">SW</span>
      <h1>Stepwise</h1>
    </div>

    <p class="sidebar-label">Curriculum</p>
    <ul id="problem-list"></ul>

    <!-- app.js drives selection through this; the sidebar mirrors it. -->
    <label class="sr-only" for="picker">Choose a problem</label>
    <select id="picker" class="sr-only"></select>

    <div class="sidebar-foot">
      <p id="total-progress">0 of 0 solved</p>
      <div id="total-bar" role="presentation"></div>
    </div>
  </nav>

  <main class="work">

    <section class="column">
      <div class="card" id="viz-pane">
        <div id="mine-bar" hidden>
          <span>Showing <strong>your run</strong> — checkpoints are off here.</span>
          <button id="mine-back" class="ghost">Back to the walkthrough</button>
        </div>

        <svg id="viz" viewBox="0 0 800 220" role="img" aria-label="Algorithm animation"></svg>
        <p id="caption"></p>

        <div id="checkpoint" hidden>
          <p id="cp-question"></p>
          <div id="cp-options"></div>
          <p id="cp-feedback" role="status"></p>
        </div>

        <div class="controls">
          <button id="play" class="primary play-btn" aria-label="Play">▶ Play</button>
          <button id="first" class="icon-btn" aria-label="First step">⏮</button>
          <button id="prev" class="icon-btn" aria-label="Previous step">◀</button>
          <button id="next" class="icon-btn" aria-label="Next step">▶</button>
          <button id="last" class="icon-btn" aria-label="Last step">⏭</button>
          <input id="scrub" type="range" min="0" value="0" aria-label="Step">
          <button id="speed" class="ghost speed-btn" aria-label="Playback speed">1×</button>
          <span id="step-count"></span>
        </div>
      </div>

      <div class="card" id="problem-pane">
        <div class="card-head"><h2 id="title"></h2><span id="difficulty"></span></div>
        <div id="statement"></div>

        <h3>Examples</h3>
        <div id="examples"></div>

        <h3>Hints</h3>
        <div id="hints"></div>
        <button id="hint-btn" class="ghost">Reveal a hint</button>
        <p id="hint-count"></p>
      </div>
    </section>

    <section class="column right" id="code-pane">
      <div id="lock" hidden>
        <p class="lock-title" id="lock-title">Predict first</p>
        <p class="lock-body" id="lock-body"></p>
      </div>
      <label for="editor">Your solution</label>
      <div class="editor-wrap" id="editor-wrap">
        <pre id="gutter" aria-hidden="true"></pre>
        <div class="editor-field">
          <pre id="highlight" aria-hidden="true"><code></code></pre>
          <textarea id="editor" spellcheck="false" autocapitalize="off"
                    autocorrect="off" autocomplete="off" wrap="off"></textarea>
        </div>
      </div>
      <div class="actions">
        <button id="run" class="primary">Run tests</button>
        <button id="viz-mine" class="ghost">Visualize my run</button>
      </div>
      <div id="results"></div>
    </section>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
